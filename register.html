<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Салон красоты</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-container {
            max-width: 400px; margin: 40px auto; background: #fff;
            padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        .error-msg { color: red; font-size: 0.8rem; display: none; margin-top: 3px; }
        .form-group.invalid input { border-color: red; }
        .form-group.invalid .error-msg { display: block; }
        .success-msg { color: green; text-align: center; margin-top: 15px; display: none; font-weight: bold; }


    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo" style="text-decoration:none;">BeautySalon</a>
        <nav class="nav">
            <a href="login.html" class="btn btn-outline">Вход</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2 style="text-align:center; margin-bottom: 20px;">Создать аккаунт</h2>
            
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="fio">ФИО *</label>
                    <input type="text" id="fio" name="fio" placeholder="Иванова Анна Сергеевна">
                    <div class="error-msg">Введите ФИО (минимум 5 символов)</div>
                </div>

                <div class="form-group">
                    <label for="phone">Телефон *</label>
                    <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67">
                    <div class="error-msg">Введите корректный номер телефона</div>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.ru">
                    <div class="error-msg">Введите корректный email (с символом @)</div>
                </div>

                <div class="form-group">
                    <label for="login">Логин *</label>
                    <input type="text" id="login" name="login" placeholder="anna_beauty">
                    <div class="error-msg">Логин от 4 до 20 символов, без пробелов</div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" name="password" placeholder="Минимум 6 символов">
                    <div class="error-msg">Пароль не менее 6 символов</div>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">Повторите пароль *</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="Повторите пароль">
                    <div class="error-msg">Пароли не совпадают</div>
                </div>

                <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 10px;">Зарегистрироваться</button>
                
                <div class="success-msg" id="successMsg">Регистрация прошла успешно! Перенаправление...</div>
            </form>
        </div>
    </main>
    <script>
        function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    const icon = type === 'success' ? '✅' : '❌';
    
    toast.innerHTML = `
        <span class="toast-icon">${icon}</span>
        <span>${message}</span>
    `;
    
    container.appendChild(toast);

    setTimeout(() => { toast.classList.add('show'); }, 100);

    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300); 
    }, 3000);
}
    // Находим форму по ID
    document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault(); // Отменяем перезагрузку страницы

        // Получаем поля (убедитесь, что ID полей в вашем HTML совпадают!)
        const fioInput = document.getElementById('fio');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const phoneInput = document.getElementById('phone');

        let isValid = true;

        // Очистка старых ошибок (если вы используете класс .invalid для красных рамок)
        document.querySelectorAll('.form-group').forEach(el => el.classList.remove('invalid'));

        // --- 1. ВАЛИДАЦИЯ (Проверка на пустоту) ---
        if (fioInput.value.trim() === '') {
            fioInput.parentElement.classList.add('invalid');
            isValid = false;
        }
        if (emailInput.value.trim() === '') {
            emailInput.parentElement.classList.add('invalid');
            isValid = false;
        }
        if (passwordInput.value.trim() === '') {
            passwordInput.parentElement.classList.add('invalid');
            isValid = false;
        }
        // Телефон может быть необязательным, если в задании не сказано иначе. Если обязателен - уберите if.
        if (phoneInput && phoneInput.value.trim() === '') {
            phoneInput.parentElement.classList.add('invalid');
            isValid = false;
        }

        // Проверка длины пароля (например, минимум 6 символов)
        if (passwordInput.value.trim().length < 6) {
            showToast('Пароль должен содержать минимум 6 символов!');
            isValid = false;
        }

        // Если все поля заполнены правильно - идем дальше
        if (isValid) {
            const emailValue = emailInput.value.trim().toLowerCase();
            const passwordValue = passwordInput.value.trim();
            const fioValue = fioInput.value.trim();
            const phoneValue = phoneInput ? phoneInput.value.trim() : '';

            // Получаем список всех пользователей из localStorage (или пустой массив, если никого нет)
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // --- 2. ПРОВЕРКА УНИКАЛЬНОСТИ ЛОГИНА (EMAIL) ---
            const isEmailTaken = users.some(user => user.email === emailValue);

            if (isEmailTaken) {
              showToast('Пользователь с таким email уже зарегистрирован!');
                emailInput.parentElement.classList.add('invalid');
                return; // Останавливаем выполнение
            }

            // --- 3. СОЗДАНИЕ И СОХРАНЕНИЕ НОВОГО ПОЛЬЗОВАТЕЛЯ ---
            const newUser = {
                id: Date.now(), // Уникальный ID на основе времени
                fio: fioValue,
                email: emailValue,
                password: passwordValue, // В реальном проекте пароль нужно хэшировать!
                phone: phoneValue,
                role: 'user' // Роль по умолчанию
            };

            // Добавляем нового пользователя в массив
            users.push(newUser);

            // Сохраняем обновленный массив обратно в localStorage
            localStorage.setItem('users', JSON.stringify(users));

            // --- 4. УСПЕХ И ПЕРЕХОД ---
           showToast('Регистрация прошла успешно! Теперь вы можете войти.');
            
            // Перекидываем на страницу входа
            window.location.href = 'login.html';
        }
    });
</script>
    <div id="toastContainer" class="toast-container"></div>
    <script src="js/validation.js"></script>
    
</body>
</html>
